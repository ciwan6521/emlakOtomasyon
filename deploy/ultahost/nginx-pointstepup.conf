# REOS — pointstepup.com
# Install: sudo cp deploy/ultahost/nginx-pointstepup.conf /etc/nginx/sites-available/pointstepup
#          sudo ln -sf /etc/nginx/sites-available/pointstepup /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace __WEB_PORT__, __API_PORT__, __MINIO_PORT__ with values from find-ports.sh
# After SSL: certbot --nginx -d pointstepup.com -d www.pointstepup.com -d api.pointstepup.com -d media.pointstepup.com

upstream reos_web {
    server 127.0.0.1:__WEB_PORT__;
    keepalive 8;
}

upstream reos_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 8;
}

upstream reos_minio {
    server 127.0.0.1:__MINIO_PORT__;
    keepalive 4;
}

server {
    listen 80;
    server_name pointstepup.com www.pointstepup.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://reos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.pointstepup.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://reos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name media.pointstepup.com;

    client_max_body_size 100m;

    location / {
        proxy_pass http://reos_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
