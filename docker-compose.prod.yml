name: reos

services:
  postgres:
    image: postgres:16-alpine
    container_name: reos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-reos} -d ${POSTGRES_DB:-reos}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: reos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9010}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env.production
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-reos}?schema=public
      RUN_SEED: ${RUN_SEED:-false}
      REOS_PROCESS: main
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4010}:4000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reos-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file: .env.production
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-reos}?schema=public
      SKIP_MIGRATE: "true"
      REOS_PROCESS: worker

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-false}
    container_name: reos-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file: .env.production
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
