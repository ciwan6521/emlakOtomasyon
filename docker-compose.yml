services:
  postgres:
    image: postgres:16-alpine
    container_name: reos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-reos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reos} -d ${POSTGRES_DB:-reos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: reos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-reos-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-reos-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: reos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reos}:${POSTGRES_PASSWORD:-reos_dev_password}@postgres:5432/${POSTGRES_DB:-reos}?schema=public
    ports:
      - "${API_PORT:-4000}:4000"
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: reos-web
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    ports:
      - "3000:3000"
    profiles: ["full"]
